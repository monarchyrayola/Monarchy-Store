<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Checkout - Monarchy Store</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<nav class="navbar navbar-dark bg-dark">
    <div class="container">
        <a href="/" class="navbar-brand">MONARCHY STORE</a>
    </div>
</nav>

<div class="container mt-5">

    <h2 class="mb-4">Checkout 🛒</h2>

    {% for message in messages %}
        <div class="alert alert-info">{{ message }}</div>
    {% endfor %}

    <div class="row">

        <div class="col-md-7">

            <div class="card shadow-sm">
                <div class="card-body">

                    <h4>Delivery Information</h4>

                    <form method="POST">
                        {% csrf_token %}

                        <label class="mt-3">Full Name</label>
                        <input type="text"
                               name="full_name"
                               class="form-control"
                               required>

                        <label class="mt-3">Phone Number</label>
                        <input type="tel"
                               name="phone"
                               class="form-control"
                               required>

                        <label class="mt-3">Delivery Address</label>
                        <textarea name="address"
                                  class="form-control"
                                  rows="4"
                                  required></textarea>

                        <label class="mt-3">Payment Method</label>

                        <select name="payment_method" class="form-select" required>
                            <option value="cod">Cash on Delivery</option>
                            <option value="mpesa">M-Pesa</option>
                            <option value="halotel" disabled>HaloPesa (Coming Soon)</option>
                            <option value="tigopesa" disabled>Tigo Pesa (Coming Soon)</option>
                            <option value="airtelmoney" disabled>Airtel Money (Coming Soon)</option>
                            <option value="nmb" disabled>NMB Bank (Coming Soon)</option>
                            <option value="crdb" disabled>CRDB Bank (Coming Soon)</option>
                        </select>

                        <button type="submit"
                                class="btn btn-success w-100 mt-4">
                            Place Order
                        </button>

                    </form>

                </div>
            </div>

        </div>

        <div class="col-md-5">

            <div class="card shadow-sm">
                <div class="card-body">

                    <h4>Order Summary</h4>

                    {% for item in cart_items %}

                    <div class="d-flex justify-content-between mt-3">
                        <span>{{ item.product.name }} × {{ item.quantity }}</span>
                        <span>TZS {{ item.subtotal }}</span>
                    </div>

                    {% endfor %}

                    <hr>

                    <h5 class="text-end">
                        Total: TZS {{ total }}
                    </h5>

                </div>
            </div>

        </div>

    </div>

</div>

</body>
</html>
